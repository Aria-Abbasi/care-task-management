services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haven
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: haven
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      HAVEN_DEBUG: "false"
      HAVEN_SECRET_KEY: local-compose-secret-change-me
      HAVEN_ALLOWED_HOSTS: localhost,127.0.0.1,api
      HAVEN_CORS_ALLOWED_ORIGINS: http://localhost:5173
      HAVEN_DATABASE_URL: postgresql://haven:haven@db:5432/haven
      HAVEN_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    environment:
      HAVEN_DEBUG: "false"
      HAVEN_SECRET_KEY: local-compose-secret-change-me
      HAVEN_DATABASE_URL: postgresql://haven:haven@db:5432/haven
      HAVEN_REDIS_URL: redis://redis:6379/0
    depends_on:
      - api

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    environment:
      HAVEN_DEBUG: "false"
      HAVEN_SECRET_KEY: local-compose-secret-change-me
      HAVEN_DATABASE_URL: postgresql://haven:haven@db:5432/haven
      HAVEN_REDIS_URL: redis://redis:6379/0
    depends_on:
      - api

volumes:
  postgres_data:
